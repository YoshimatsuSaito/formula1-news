name: Inspect source HTML

# スクレイピング対象サイトの HTML を実際に取得してログに出す診断用ワークフロー。
# 開発環境から対象サイトへ到達できないことがあるため、Actions のネットワークを
# 借りて「掲載日がページのどこに書かれているか」等を確認するのに使う。
# 手動実行のみ。デプロイには一切関与しない。
on:
  workflow_dispatch:
    inputs:
      sources:
        description: '調べるソース名（カンマ区切り。例: F1速報,skysports）'
        required: true
        default: 'F1速報,skysports'
      selectors:
        description: 'HTML ソースで試すセレクタ候補（"|" 区切り。空なら試さない）'
        required: false
        default: ''
      url:
        description: '一覧ページの URL を差し替える（空なら config のまま）'
        required: false
        default: ''
      html_dump:
        description: '記事リンク周辺の HTML も出す（量が多いので既定は off）'
        type: boolean
        default: false
      lambda_logs:
        description: 'Lambda を実行してそのログも出す（AWS 側の見え方を確認する）'
        type: boolean
        default: true

permissions:
  contents: read

env:
  STACK_NAME: f1-news-website
  AWS_REGION: ap-northeast-1

jobs:
  inspect:
    name: Fetch and dump HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # まず Actions のネットワークから見た状態
      - name: Inspect
        # 入力は env 経由で渡す（run に直接埋めるとスクリプト実行の余地ができる）
        env:
          SOURCES: ${{ inputs.sources }}
          SELECTORS: ${{ inputs.selectors }}
          URL: ${{ inputs.url }}
          INSPECT_HTML_DUMP: ${{ inputs.html_dump && '1' || '0' }}
        run: python tools/inspect_source.py "$SOURCES" "$SELECTORS" "$URL"

      # 次に Lambda のネットワークから見た状態。IP で弾かれている場合、
      # ここだけ失敗するので切り分けになる
      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.lambda_logs
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Invoke Lambda and show its log
        if: inputs.lambda_logs
        run: |
          set -euo pipefail
          FUNC=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ScraperFunctionName`].OutputValue' \
            --output text)
          echo "function: $FUNC"
          # --log-type Tail で実行ログの末尾が応答に入る
          aws lambda invoke --function-name "$FUNC" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            --log-type Tail --query LogResult --output text response.json \
            | base64 -d
