name: Deploy F1 News to S3

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:          # Allow manual trigger from GitHub UI

permissions:
  id-token: write  # Required for OIDC auth (if using IAM role instead of keys)
  contents: read

env:
  STACK_NAME: f1-news-website
  AWS_REGION: ap-northeast-1

jobs:
  # ── Job 1: Deploy / update AWS infrastructure via CloudFormation ───────────
  infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    outputs:
      bucket_name:      ${{ steps.outputs.outputs.bucket_name }}
      website_url:      ${{ steps.outputs.outputs.website_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Change sets are never deleted automatically, and this workflow used to run
      # `cloudformation deploy` on every scheduled tick (every 30 min), creating a new
      # change set each time even when the template hadn't changed. That eventually hit
      # CloudFormation's per-stack change set limit and started failing the whole workflow.
      # Only deploy the stack when the template could actually have changed.
      - name: Delete old CloudFormation change sets
        if: github.event_name != 'schedule'
        run: |
          aws cloudformation list-change-sets --stack-name "$STACK_NAME" \
            --query 'Summaries[].ChangeSetId' --output text 2>/dev/null |
          tr '\t' '\n' | while read -r CS_ID; do
            [ -n "$CS_ID" ] && aws cloudformation delete-change-set \
              --stack-name "$STACK_NAME" --change-set-name "$CS_ID"
          done

      - name: Deploy CloudFormation stack
        if: github.event_name != 'schedule'
        run: |
          # Template is < 51KB and has no packaged artifacts, so CloudFormation
          # uploads it inline — no SAM-managed S3 bucket required.
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)

          BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
          URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="WebsiteUrl") | .OutputValue')

          echo "bucket_name=$BUCKET"       >> "$GITHUB_OUTPUT"
          echo "website_url=$URL"          >> "$GITHUB_OUTPUT"
          echo "Website: $URL"

  # ── Job 2: Scrape news, generate HTML, upload to S3 ────────────────────────
  content:
    name: Generate & upload content
    runs-on: ubuntu-latest
    needs: infrastructure
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate index.html
        run: python generate.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp index.html s3://${{ needs.infrastructure.outputs.bucket_name }}/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0"

      - name: Show website URL
        run: |
          echo "Deployed: ${{ needs.infrastructure.outputs.website_url }}"
