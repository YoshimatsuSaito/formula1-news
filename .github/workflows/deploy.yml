name: Deploy F1 News to S3

# 定期更新は EventBridge + Lambda が担う（template.yaml 参照）。
# GitHub の schedule はイベント自体が配信されず更新間隔を制御できなかった
# （実測で配信率 13.7%、5分ごとに増やしても3時間15分で配信0件）。
# このワークフローの役割はコードを配ることだけで、定期実行には関与しない。
on:
  push:
    branches: [main]
  workflow_dispatch:          # 手動でスタック更新とコード配布をやり直す用

concurrency:
  group: deploy-f1-news
  cancel-in-progress: true

permissions:
  id-token: write  # Required for OIDC auth (if using IAM role instead of keys)
  contents: read

env:
  STACK_NAME: f1-news-website
  AWS_REGION: ap-northeast-1

jobs:
  # ── Job 1: Deploy / update AWS infrastructure via CloudFormation ───────────
  infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bucket_name:      ${{ steps.outputs.outputs.bucket_name }}
      website_url:      ${{ steps.outputs.outputs.website_url }}
      function_name:    ${{ steps.outputs.outputs.function_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # change set は自動では消えないため、積もるとスタックの上限に達して
      # デプロイが失敗する。このワークフローは push 時だけ動くので頻度は低いが、
      # 念のため毎回古いものを掃除しておく。
      - name: Delete old CloudFormation change sets
        run: |
          aws cloudformation list-change-sets --stack-name "$STACK_NAME" \
            --query 'Summaries[].ChangeSetId' --output text 2>/dev/null |
          tr '\t' '\n' | while read -r CS_ID; do
            [ -n "$CS_ID" ] && aws cloudformation delete-change-set \
              --stack-name "$STACK_NAME" --change-set-name "$CS_ID"
          done

      - name: Deploy CloudFormation stack
        run: |
          # Template is < 51KB and has no packaged artifacts, so CloudFormation
          # uploads it inline — no SAM-managed S3 bucket required.
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)

          BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
          URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="WebsiteUrl") | .OutputValue')
          FUNC=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ScraperFunctionName") | .OutputValue')

          echo "bucket_name=$BUCKET"       >> "$GITHUB_OUTPUT"
          echo "website_url=$URL"          >> "$GITHUB_OUTPUT"
          echo "function_name=$FUNC"       >> "$GITHUB_OUTPUT"
          echo "Website: $URL"

  # ── Job 2: 定期実行される Lambda のコードを更新 ─────────────────────────────
  # 定期実行は EventBridge が担うので、この job は「中身を配る」だけ。
  # 最後に invoke するので、push のたびにページも最新になる。
  scraper:
    name: Package & deploy scraper
    runs-on: ubuntu-latest
    needs: infrastructure
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build deployment package
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build
          # Lambda の実行環境に合わせたバイナリを選ばせる。lxml はネイティブ拡張
          # なので、ランナー任せに入れるとアーキテクチャ違いでインポートに失敗する
          pip install -r requirements.txt \
            --target build \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade
          # boto3 は Lambda ランタイムに同梱されているので入れない
          cp lambda_handler.py generate.py build/
          cp -r modules config templates build/
          find build -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd build && zip -qr ../function.zip .)
          ls -lh function.zip

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update function code
        env:
          FUNC: ${{ needs.infrastructure.outputs.function_name }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNC" \
            --zip-file fileb://function.zip \
            --publish >/dev/null
          aws lambda wait function-updated --function-name "$FUNC"
          echo "Updated $FUNC"

      # 配ったコードが実際に動くところまで確認する。ここで失敗すれば
      # 定期実行に乗る前に気づける
      - name: Smoke test
        env:
          FUNC: ${{ needs.infrastructure.outputs.function_name }}
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "$FUNC" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' response.json > invoke.json
          cat invoke.json
          echo "--- response ---"
          cat response.json; echo
          if jq -e '.FunctionError' invoke.json >/dev/null 2>&1; then
            echo "::error::Lambda がエラーを返しました"
            exit 1
          fi
