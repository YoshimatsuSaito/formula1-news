sites:
  # autosport-japan (as-web.jp) は削除した。F1速報 が同じ三栄の発行で
  # autosport web の記事を転載しており、見出しの実測で 8/10 が重複していた。
  # 残る差分も F1速報 側の掲載タイミングのずれによるもので、内容の傾向は同じ。

  motorsport-jp:
    source: rss
    news_home: "https://jp.motorsport.com/f1/news/"
    rss_url: "https://jp.motorsport.com/rss/f1/news/"

  F1速報:
    # 旧・携帯向けサイト由来で見出しに class が振られていないため、
    # 記事詳細の URL パターン (`page=news/sp/body&no=<記事ID>`) で拾う。
    # ページによって href が URL エンコードされるため両表記を対象にする。
    # /pc/free/ ではなく /free/ を見るのは、抽出されるリンクも同じ配下になり
    # スマホで開いたときにモバイル版の記事ページに飛ぶため。
    source: html
    prefix_home: ""
    news_home: "https://f1sokuho.mopita.com/free/index.php?uid=NULLGWDOCOMO&pass=&page=news/sp/top"
    scrape_title: 'a[href*="news/sp/body"], a[href*="news%2Fsp%2Fbody"]'
    get_title: "lambda x: x.get_text(strip=True)"
    scrape_link: 'a[href*="news/sp/body"], a[href*="news%2Fsp%2Fbody"]'
    get_link: "lambda x: x['href']"

  shigasports:
    source: html
    prefix_home: ""
    news_home: "https://shigasports.com/f1news/"
    scrape_title: "#archive-container .entry-title a"
    get_title: "lambda x: x.get_text(strip=True)"
    scrape_link: "#archive-container .entry-title a"
    get_link: "lambda x: x['href']"

  BBC:
    source: rss
    news_home: "https://www.bbc.com/sport/formula1"
    rss_url: "https://feeds.bbci.co.uk/sport/formula1/rss.xml"

  skysports:
    # rss/12040.xml は廃止済み → HTML scraping にフォールバック
    # JS描画の場合は 0件スキップになるが 404エラーは出なくなる
    source: html
    prefix_home: "https://www.skysports.com"
    news_home: "https://www.skysports.com/f1/news"
    scrape_title: "a.sdc-site-tile__headline-link span.sdc-site-tile__headline-text"
    get_title: "lambda x: x.get_text(strip=True)"
    scrape_link: "a.sdc-site-tile__headline-link"
    get_link: "lambda x: x['href'] if x.has_attr('href') else ''"

  motorsport-en:
    source: rss
    news_home: "https://www.motorsport.com/f1/news/"
    rss_url: "https://www.motorsport.com/rss/f1/news/"

  F1-Gate:
    # RSS feed (/feed/) は存在しない（WordPress形式でないため）→ HTML scraping
    source: html
    prefix_home: ""
    news_home: "https://f1-gate.com"
    scrape_title: ".content h2 a"
    get_title: "lambda x: x.get_text(strip=True)"
    scrape_link: ".content h2 a"
    get_link: "lambda x: x.attrs['href']"

  F1情報通:
    # HTML scraping は GitHub Actions IP をブロックされるため Atom feed に切替
    # 件数は5件固定だが安定性を優先
    source: rss
    news_home: "http://f1jouhou2.blog.fc2.com"
    rss_url: "http://f1jouhou2.blog.fc2.com/?xml"
